# Font Configuration
font_family      Fira Code

# Nerd Fonts v3.4.0
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes
remember_window_size no

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 20000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings
# Some defaults because I forget:
#   tabs:    ctrl+shift+q close, ctrl+shift+left/right or ctrl+(shift+)tab cycle,
#            ctrl+shift+,/. move, ctrl+shift+alt+t rename
#   windows: ctrl+shift+w close, ctrl+shift+f11 fullscreen
#   utils:   ctrl+shift+/ or ctrl+shift+f search scrollback, ctrl+shift+h scrollback in pager,
#            ctrl+shift+g last command output, ctrl+shift+z/x prev/next prompt,
#            ctrl+shift+e open URL, ctrl+shift+p>f insert path, ctrl+shift+u unicode,
#            ctrl+shift+backspace reset font size,
#            ctrl+shift+f5 reload config, ctrl+shift+f2 edit config, ctrl+shift+f3 palette

# New tab / OS window in the current directory (defaults don't keep the cwd)
map kitty_mod+t launch --cwd=current --type=tab
map kitty_mod+n launch --cwd=current --type=os-window

# Jump to tab N (matches the [index] in the tab title; defaults go to split N instead)
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9

# Font size in steps of 1 (default 2). equal/plus/kp_add are all kept on purpose:
# `+` is shift+= on us/us-intl but its own key on latam.
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+plus change_font_size all +1.0
map kitty_mod+kp_add change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+kp_subtract change_font_size all -1.0

# Layout-independent scrollback search: on latam `/` is shift+7, so the default
# ctrl+shift+/ can't be typed there (ctrl+shift+7 is tab 7). ctrl+shift+f is freed below.
map kitty_mod+f search_scrollback

# No splits: unmap the window (split) management defaults so the keys reach programs
map kitty_mod+enter
map kitty_mod+]
map kitty_mod+[
map kitty_mod+b
map kitty_mod+`
map kitty_mod+r
map kitty_mod+0
map kitty_mod+f7
map kitty_mod+f8
map kitty_mod+l

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

### Colorscheme
include display/${XDG_SESSION_TYPE}.conf

### Differences between machines
include machines/${HOSTNAME}.conf
